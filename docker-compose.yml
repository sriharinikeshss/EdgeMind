version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: edgemind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d edgemind"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ── Local LLM inference server (Phase 1 — M2) ───────────────────────────
  # Pull models after first boot: docker exec -it <container> ollama pull qwen2.5:1.5b && ollama pull qwen2.5-coder:1.5b
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # To use a GPU: add the deploy block below and ensure nvidia-container-toolkit is installed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/edgemind
      - QDRANT_URL=http://qdrant:6333
      - MINIO_URL=http://minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_REASONING_MODEL=qwen2.5:1.5b
      - OLLAMA_CODING_MODEL=qwen2.5-coder:1.5b
      - OLLAMA_VISION_MODEL=llava
      - JWT_SECRET_KEY=kavach-dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
      - //var/run/docker.sock:/var/run/docker.sock
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  ollama_data:
